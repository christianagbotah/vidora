name: One-shot generation economics repair

on:
  push:
    branches:
      - production-hardening/p0-security-billing
    paths:
      - scripts/generation-economics-repair.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-hardening/p0-security-billing
          fetch-depth: 0
      - name: Apply exact asserted repair
        run: python3 scripts/generation-economics-repair.py
      - name: Commit repair
        run: |
          if git diff --quiet -- src/app/api/generate-video/route.ts; then
            echo "No repair necessary."
            exit 0
          fi
          git config user.name "vidora-hardening-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/api/generate-video/route.ts
          git commit -m "billing: require reconciliation for ambiguous generation failures"
          git push origin HEAD:production-hardening/p0-security-billing
