name: Apply Full Preview UI patch

on:
  push:
    branches:
      - hardening/full-preview-recovery

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/full-preview-recovery
          fetch-depth: 0
      - name: Patch studio page
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page = Path('src/app/page.tsx')
          text = page.read_text()

          import_anchor = 'import NarrationProfileControls from "@/components/NarrationProfileControls";'
          import_line = 'import { FullPreviewDialog } from "@/components/FullPreviewDialog";'
          if import_line not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit('Full Preview import anchor was not unique')
              text = text.replace(import_anchor, import_anchor + '\n' + import_line, 1)

          dialog_anchor = '      {/* Video Preview Dialog */}'
          dialog_marker = '      {/* Full Preview Review Dialog */}'
          if dialog_marker not in text:
              if text.count(dialog_anchor) != 1:
                  raise SystemExit('Full Preview dialog anchor was not unique')
              dialog = '''      {/* Full Preview Review Dialog */}
      <FullPreviewDialog
        open={fullPreviewOpen}
        onOpenChange={setFullPreviewOpen}
        previewUrl={fullPreviewUrl}
        isRebuilding={isBuildingFullPreview}
        onRebuild={handleBuildFullPreview}
        onProceedToExport={() => {
          setFullPreviewOpen(false);
          setExportDialogOpen(true);
        }}
      />

'''
              text = text.replace(dialog_anchor, dialog + dialog_anchor, 1)

          page.write_text(text)
          PY
      - name: Commit exact patch and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_temp-full-preview-ui-patch.yml
          git add src/app/page.tsx
          git diff --cached --check
          git commit -m "Restore resilient Full Preview review surface"
          git push origin HEAD:hardening/full-preview-recovery
