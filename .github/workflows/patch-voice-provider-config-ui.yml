name: Patch voice provider config UI

on:
  push:
    branches:
      - feat/voice-provider-config-ui-20260905-finalz

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[voice-provider-config-ui-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact patch
        run: python3 scripts/patch-voice-provider-config-ui.py
      - name: Commit patched production files
        run: |
          if git diff --quiet; then
            echo "No changes produced"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/admin/config/route.ts src/app/admin/providers/page.tsx src/app/page.tsx
          git commit -m "feat: add secure optional voice provider configuration [voice-provider-config-ui-applied]"
          git push
