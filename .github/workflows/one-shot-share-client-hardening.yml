name: One-shot protected share client hardening

on:
  push:
    branches:
      - production-hardening/p0-security-billing
    paths:
      - .github/workflows/one-shot-share-client-hardening.yml
      - scripts/share-client-hardening.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-hardening/p0-security-billing
          fetch-depth: 0
      - name: Apply exact share client hardening
        run: python3 scripts/share-client-hardening.py
      - name: Commit protected share client
        run: |
          if git diff --quiet -- 'src/app/share/[slug]/ShareClient.tsx'; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "vidora-hardening-bot"
          git config user.email "actions@users.noreply.github.com"
          git add 'src/app/share/[slug]/ShareClient.tsx'
          git commit -m "security: keep protected share credentials and content private"
          git push origin HEAD:production-hardening/p0-security-billing
