name: One-shot strict type repair

on:
  push:
    branches:
      - production-hardening/p0-security-billing
    paths:
      - scripts/strict-type-repair.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: production-hardening/p0-security-billing
          fetch-depth: 0

      - name: Apply exact asserted repairs
        run: python3 scripts/strict-type-repair.py

      - name: Commit repairs
        run: |
          if git diff --quiet -- src/app/page.tsx src/app/api/export-video/route.ts; then
            echo "No repairs were necessary."
            exit 0
          fi
          git config user.name "vidora-hardening-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/page.tsx src/app/api/export-video/route.ts
          git commit -m "types: repair strict UI and export job contracts"
          git push origin HEAD:production-hardening/p0-security-billing
