name: Apply post-generation edit and preview

on:
  push:
    branches:
      - feature/post-generation-edit-preview

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded source patch
        run: python3 scripts/patch-post-generation-edit-preview.py
      - name: Validate diff
        run: git diff --check
      - name: Commit product changes
        run: |
          if git diff --quiet; then
            echo "No product changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma src/types/video.ts \
            'src/app/api/projects/[id]/scenes/[sceneId]/route.ts' \
            'src/app/api/projects/[id]/scenes/[sceneId]/regenerate/route.ts' \
            'src/app/api/projects/[id]/finalize-draft/route.ts' \
            src/app/api/concatenate-video/route.ts src/app/page.tsx
          git commit -m "feat(editor): revise completed scenes and preview full cut"
          git push origin HEAD:feature/post-generation-edit-preview
