name: One-shot provider boundary audit

on:
  push:
    branches:
      - production-hardening/p0-security-billing
    paths:
      - .github/workflows/one-shot-provider-boundary-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-hardening/p0-security-billing
      - name: Enumerate direct provider calls
        run: |
          echo '=== DIRECT Z.AI PROVIDER CALLS ==='
          git grep -n -E 'zai\.(chat|vision|generateImage|generateVideo|tts|asr|pollVideoTask)' -- 'src/**/*.ts' 'scripts/**/*.ts' || true
          echo '=== END PROVIDER CALLS ==='
