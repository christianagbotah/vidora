name: Patch preview language cleanup

on:
  push:
    branches:
      - fix/preview-language-cleanup-20260905

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[preview-language-patch-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact patch
        run: python3 scripts/patch-preview-language-cleanup.py
      - name: Commit patched files
        run: |
          if git diff --quiet; then
            echo "No changes produced"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/projects/route.ts src/app/api/video-status/route.ts src/lib/full-preview-render.ts src/app/page.tsx
          git commit -m "fix: remove duplicate language control and recover legacy media [preview-language-patch-applied]"
          git push
