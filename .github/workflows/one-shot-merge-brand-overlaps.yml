name: One-shot Vidora Studio overlap reconciliation

on:
  push:
    branches:
      - production-hardening/p0-security-billing
    paths:
      - scripts/merge-brand-overlaps.py

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-hardening/p0-security-billing
          fetch-depth: 0
      - name: Apply exact overlap reconciliation
        run: python3 scripts/merge-brand-overlaps.py
      - name: Commit reconciled production files
        run: |
          if git diff --quiet -- src/app/page.tsx src/app/api/assistant/chat/route.ts src/app/api/export-video/route.ts; then
            echo "No overlap reconciliation necessary."
            exit 0
          fi
          git config user.name "vidora-hardening-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/page.tsx src/app/api/assistant/chat/route.ts src/app/api/export-video/route.ts
          git commit -m "merge: reconcile Vidora Studio branding with P0 hardening"
          git push origin HEAD:production-hardening/p0-security-billing
