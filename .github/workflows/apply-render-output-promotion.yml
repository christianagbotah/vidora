name: Apply render output promotion patch

on:
  push:
    branches:
      - "fix/render-output-promotion-20260908"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "fix/render-output-promotion-20260908"
          fetch-depth: 0
      - name: Patch sources
        run: python3 scripts/apply-render-output-promotion.py
      - name: Commit patched production code
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: promote rendered media without buffering"
          git push origin HEAD:fix/render-output-promotion-20260908
