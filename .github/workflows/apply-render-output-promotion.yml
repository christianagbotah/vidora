name: Apply render output promotion patch

on:
  push:
    branches:
      - fix/render-output-promotion-20260908

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/render-output-promotion-20260908
          fetch-depth: 0

      - name: Apply exact source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # Shared generated-store promotion helper: atomic rename on the normal
          # same-filesystem path; streaming filesystem copy only for EXDEV.
          replace_once(
              "src/lib/generated-store.ts",
              'import { mkdir, writeFile, readFile, stat } from "fs/promises";',
              'import { copyFile, mkdir, readFile, rename, stat, unlink, writeFile } from "fs/promises";',
          )
          replace_once(
              "src/lib/generated-store.ts",
              '''export function generatedStoreDir(): string {\n  return STORE_DIR;\n}\n''',
              '''export function generatedStoreDir(): string {\n  return STORE_DIR;\n}\n\n/**\n * Promote an already-rendered file into the persistent generated store without\n * buffering the complete media file in JavaScript memory. Render workdirs are\n * normally inside this store, so rename is an atomic metadata operation. The\n * EXDEV fallback covers future callers whose source lives on another filesystem.\n */\nexport async function promoteGeneratedFile(\n  sourcePath: string,\n  relPath: string,\n): Promise<{ path: string; url: string }> {\n  const safe = sanitizeRelPath(relPath);\n  const abs = path.join(STORE_DIR, safe);\n  await mkdir(path.dirname(abs), { recursive: true });\n\n  if (path.resolve(sourcePath) !== path.resolve(abs)) {\n    try {\n      await rename(sourcePath, abs);\n    } catch (error) {\n      const code =\n        typeof error === "object" && error !== null && "code" in error\n          ? String((error as { code?: unknown }).code ?? "")\n          : "";\n      if (code !== "EXDEV") throw error;\n      await copyFile(sourcePath, abs);\n      await unlink(sourcePath);\n    }\n  }\n\n  return { path: abs, url: `/generated/${safe}` };\n}\n''',
          )

          # Durable Full Preview.
          replace_once(
              "src/lib/full-preview-render.ts",
              'import { mkdir, readFile, rm, writeFile } from "fs/promises";',
              'import { mkdir, rm, writeFile } from "fs/promises";',
          )
          replace_once(
              "src/lib/full-preview-render.ts",
              'import { generatedFilePath, generatedStoreDir, resolvePublicAssetPath } from "@/lib/generated-store";',
              'import { generatedStoreDir, promoteGeneratedFile, resolvePublicAssetPath } from "@/lib/generated-store";',
          )
          replace_once(
              "src/lib/full-preview-render.ts",
              '''    const outputName = `preview_${projectId}_${expectedCutVersion}_${Date.now()}.mp4`;\n    const persistentPath = generatedFilePath(outputName);\n    await mkdir(path.dirname(persistentPath), { recursive: true });\n    await writeFile(persistentPath, await readFile(outputPath));\n    return {\n      previewVideoUrl: `/generated/${outputName}`,''',
              '''    const outputName = `preview_${projectId}_${expectedCutVersion}_${Date.now()}.mp4`;\n    const { path: persistentPath, url: previewVideoUrl } = await promoteGeneratedFile(\n      outputPath,\n      outputName,\n    );\n    return {\n      previewVideoUrl,''',
          )

          # Production final export: single- and multi-scene pipelines.
          replace_once(
              "src/app/api/export-video/route-core.ts",
              'import { generatedStoreDir, generatedFilePath, resolvePublicAssetPath } from "@/lib/generated-store";',
              'import { generatedStoreDir, promoteGeneratedFile, resolvePublicAssetPath } from "@/lib/generated-store";',
          )
          replace_once(
              "src/app/api/export-video/route-core.ts",
              'import { writeFile, mkdir, rm, readFile } from "fs/promises";',
              'import { writeFile, mkdir, rm } from "fs/promises";',
          )
          replace_once(
              "src/app/api/export-video/route-core.ts",
              '''    // Copy final to the persistent generated store\n    await onProgress(94, "Saving final video…");\n    const finalPath = generatedFilePath(outputFileName);\n    const finalData = await readFile(outputPath);\n    await mkdir(path.dirname(finalPath), { recursive: true });\n    await writeFile(finalPath, finalData);\n\n    const finalVideoUrl = `/generated/${outputFileName}`;\n    const fileSize = statSync(finalPath).size;\n    const outputDuration = await getVideoDuration(outputPath);''',
              '''    // Promote the completed render without loading the MP4/WebM into JS memory.\n    await onProgress(94, "Saving final video…");\n    const { path: finalPath, url: finalVideoUrl } = await promoteGeneratedFile(\n      outputPath,\n      outputFileName,\n    );\n    const fileSize = statSync(finalPath).size;\n    const outputDuration = await getVideoDuration(finalPath);''',
          )
          replace_once(
              "src/app/api/export-video/route-core.ts",
              '''    // ── Step 7: Copy to the persistent generated store ───────────────\n    await onProgress(94, "Saving final video…");\n    const finalPath = generatedFilePath(outputFileName);\n    const finalData = await readFile(outputPath);\n    await mkdir(path.dirname(finalPath), { recursive: true });\n    await writeFile(finalPath, finalData);\n\n    const finalVideoUrl = `/generated/${outputFileName}`;\n\n    // ── Step 8: Gather output stats ──────────────────────────────────\n    const fileSize = statSync(finalPath).size;\n    const outputDuration = await getVideoDuration(outputPath);''',
              '''    // ── Step 7: Promote to the persistent generated store ────────────\n    await onProgress(94, "Saving final video…");\n    const { path: finalPath, url: finalVideoUrl } = await promoteGeneratedFile(\n      outputPath,\n      outputFileName,\n    );\n\n    // ── Step 8: Gather output stats ──────────────────────────────────\n    const fileSize = statSync(finalPath).size;\n    const outputDuration = await getVideoDuration(finalPath);''',
          )

          # Legacy direct concatenate fallback is still reachable and should not
          # retain the same full-buffer defect.
          replace_once(
              "src/app/api/concatenate-video/route.ts",
              '''  generatedStoreDir,\n  generatedFilePath,\n  resolvePublicAssetPath,''',
              '''  generatedStoreDir,\n  promoteGeneratedFile,\n  resolvePublicAssetPath,''',
          )
          replace_once(
              "src/app/api/concatenate-video/route.ts",
              'import { writeFile, mkdir, rm, readFile } from "fs/promises";',
              'import { writeFile, mkdir, rm } from "fs/promises";',
          )
          replace_once(
              "src/app/api/concatenate-video/route.ts",
              '''      const resultFileName = `final_${projectId}.mp4`;\n      const resultPath = generatedFilePath(resultFileName);\n      await mkdir(path.dirname(resultPath), { recursive: true });\n      await writeFile(resultPath, await readFile(outputPath));\n      const resultVideoUrl = `/generated/${resultFileName}`;''',
              '''      const resultFileName = `final_${projectId}.mp4`;\n      const { url: resultVideoUrl } = await promoteGeneratedFile(\n        outputPath,\n        resultFileName,\n      );''',
          )

          Path("tests/unit/generated-output-promotion.test.ts").write_text(r'''import { afterEach, describe, expect, it, vi } from "vitest";
import { mkdtemp, mkdir, readFile, rm, writeFile } from "fs/promises";
import { existsSync, readFileSync } from "fs";
import os from "os";
import path from "path";

const originalGeneratedDir = process.env.GENERATED_DIR;
const tempRoots: string[] = [];

afterEach(async () => {
  if (originalGeneratedDir === undefined) delete process.env.GENERATED_DIR;
  else process.env.GENERATED_DIR = originalGeneratedDir;
  vi.resetModules();
  await Promise.all(tempRoots.splice(0).map((root) => rm(root, { recursive: true, force: true })));
});

describe("generated output promotion", () => {
  it("moves a completed render into the generated store without a Buffer copy", async () => {
    const root = await mkdtemp(path.join(os.tmpdir(), "vidora-promote-"));
    tempRoots.push(root);
    const store = path.join(root, "store");
    const work = path.join(store, "work");
    await mkdir(work, { recursive: true });
    const source = path.join(work, "render.mp4");
    await writeFile(source, Buffer.from("completed-render"));

    process.env.GENERATED_DIR = store;
    vi.resetModules();
    const { promoteGeneratedFile } = await import("../../src/lib/generated-store");
    const promoted = await promoteGeneratedFile(source, "final_project_123.mp4");

    expect(promoted.url).toBe("/generated/final_project_123.mp4");
    expect(promoted.path).toBe(path.join(store, "final_project_123.mp4"));
    expect(existsSync(source)).toBe(false);
    expect((await readFile(promoted.path)).toString()).toBe("completed-render");
  });

  it("wires every completed-video path through promoteGeneratedFile", () => {
    const preview = readFileSync("src/lib/full-preview-render.ts", "utf8");
    const exporter = readFileSync("src/app/api/export-video/route-core.ts", "utf8");
    const legacy = readFileSync("src/app/api/concatenate-video/route.ts", "utf8");
    const store = readFileSync("src/lib/generated-store.ts", "utf8");

    expect(preview).toContain("await promoteGeneratedFile(");
    expect(exporter.match(/await promoteGeneratedFile\(/g)?.length).toBe(2);
    expect(legacy).toContain("await promoteGeneratedFile(");

    expect(preview).not.toContain("readFile(outputPath)");
    expect(exporter).not.toContain("readFile(outputPath)");
    expect(exporter).not.toContain("finalData = await readFile");
    expect(legacy).not.toContain("readFile(outputPath)");

    expect(store).toContain("await rename(sourcePath, abs)");
    expect(store).toContain('if (code !== "EXDEV") throw error');
    expect(store).toContain("await copyFile(sourcePath, abs)");
    expect(store).toContain("await unlink(sourcePath)");
  });
});
''')
          PY

          git diff --check
          rm .github/workflows/apply-render-output-promotion.yml

      - name: Commit patched production code
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: promote rendered media without buffering"
          git push origin HEAD:fix/render-output-promotion-20260908
