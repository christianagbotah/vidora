name: One-shot generation enqueue cutover

on:
  push:
    branches:
      - production-hardening/p0-security-billing
    paths:
      - scripts/generation-enqueue-cutover.py

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-hardening/p0-security-billing
          fetch-depth: 0
      - name: Apply exact enqueue cutover
        run: python3 scripts/generation-enqueue-cutover.py
      - name: Commit cutover
        run: |
          if git diff --quiet -- src/app/api/generate-video/route.ts; then
            echo "No cutover necessary."
            exit 0
          fi
          git config user.name "vidora-hardening-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/api/generate-video/route.ts
          git commit -m "jobs: make batch generation route enqueue-only"
          git push origin HEAD:production-hardening/p0-security-billing
