name: Apply navigation hotfix

on:
  push:
    branches:
      - fix/generation-navigation-recovery

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/generation-navigation-recovery
          fetch-depth: 0

      - name: Apply guarded UI patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/app/page.tsx')
          text = path.read_text()

          replacements = [
              (
                  '''  onContinue,\n  onRetry,\n  isRetrying,\n}: {''',
                  '''  onContinue,\n  onBack,\n  onRetry,\n  isRetrying,\n}: {'''
              ),
              (
                  '''  onContinue: () => void;\n  onRetry: () => void;\n  isRetrying: boolean;''',
                  '''  onContinue: () => void;\n  onBack: () => void;\n  onRetry: () => void;\n  isRetrying: boolean;'''
              ),
              (
                  '''  // Generation overlay phase — locks the ENTIRE page while videos render\n  const [generationPhase, setGenerationPhase] = useState<"idle" | "starting" | "generating" | "completed" | "failed">("idle");\n  // Timestamp (ms) when the current generation run started — drives elapsed timer\n  const [generationStartedAt, setGenerationStartedAt] = useState<number | null>(null);''',
                  '''  // Generation overlay phase. Rendering itself is durable/background-safe;\n  // the overlay is only a progress surface and must never trap the user.\n  const [generationPhase, setGenerationPhase] = useState<"idle" | "starting" | "generating" | "completed" | "failed">("idle");\n  // Timestamp (ms) when the current generation run started — drives elapsed timer\n  const [generationStartedAt, setGenerationStartedAt] = useState<number | null>(null);\n  // Once a user deliberately leaves the progress overlay, do not immediately\n  // reopen it from the reload/recovery effect while the same run is active.\n  const [generationOverlayDismissed, setGenerationOverlayDismissed] = useState(false);'''
              ),
              (
                  '''    if (currentView !== "studio" || !currentProject || generationPhase !== "idle") return;''',
                  '''    if (currentView !== "studio" || !currentProject || generationPhase !== "idle" || generationOverlayDismissed) return;'''
              ),
              (
                  '''  }, [currentView, currentProject, safeScenes, generationPhase]);''',
                  '''  }, [currentView, currentProject, safeScenes, generationPhase, generationOverlayDismissed]);'''
              ),
              (
                  '''  const handleGenerateAll = async () => {\n    if (!currentProject) return;\n    setIsGenerating(true);''',
                  '''  const handleGenerateAll = async () => {\n    if (!currentProject) return;\n    setGenerationOverlayDismissed(false);\n    setIsGenerating(true);'''
              ),
              (
                  '''    const failedScenes = safeScenes.filter((s) => s.status === "failed" && !s.videoUrl);\n    if (failedScenes.length === 0) return;\n    setGenerationPhase("generating"); // keep the page locked during retry''',
                  '''    const failedScenes = safeScenes.filter((s) => s.status === "failed" && !s.videoUrl);\n    if (failedScenes.length === 0) return;\n    setGenerationOverlayDismissed(false);\n    setGenerationPhase("generating");'''
              ),
              (
                  '''      setCurrentProject(project);\n      if (project.characters) setCharacters(project.characters);\n      setCurrentView("studio");\n      setGenerationStartedAt(Date.now());\n      setGenerationPhase("starting");''',
                  '''      setCurrentProject(project);\n      if (project.characters) setCharacters(project.characters);\n      setCurrentView("studio");\n      setGenerationOverlayDismissed(false);\n      setGenerationStartedAt(Date.now());\n      setGenerationPhase("starting");'''
              ),
              (
                  '''        {/* ── Footer actions ── */}\n        {phase === "completed" && (''',
                  '''        {/* ── Footer actions ── */}\n        {isActive && (\n          <div className="px-6 pb-6 space-y-2">\n            {failed > 0 && (\n              <div className="rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-xs text-red-700">\n                {failed} scene{failed === 1 ? " has" : "s have"} failed. You can return to the project now and retry failed scenes without waiting on this screen.\n              </div>\n            )}\n            <Button variant="outline" className="w-full h-11" onClick={onBack}>\n              <ArrowLeft className="h-4 w-4 mr-1.5" />Back to Project\n            </Button>\n            <p className="text-[11px] text-muted-foreground text-center">\n              Rendering continues safely in the background. You can leave this screen and return to the project at any time.\n            </p>\n          </div>\n        )}\n        {phase === "completed" && ('''
              ),
              (
                  '''                {isEstimated\n                  ? "Progress is estimated in real time and updates as each clip finishes."\n                  : "The page stays locked while your video renders — this usually takes a few minutes."}''',
                  '''                {isEstimated\n                  ? "Progress is estimated in real time and updates as each clip finishes."\n                  : "Rendering continues in the background — you can safely return to your project while it finishes."}'''
              ),
              (
                  '''      <main className="flex-1 pt-14 pb-20 md:pb-0">\n        <AnimatePresence mode="wait">''',
                  '''      <main className="flex-1 pt-14 pb-20 md:pb-0">\n        {currentView !== "home" && (\n          <div className="sticky top-14 z-30 border-b border-slate-200/80 bg-white/95 backdrop-blur supports-[backdrop-filter]:bg-white/85">\n            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-2">\n              <Button\n                variant="ghost"\n                size="sm"\n                onClick={() => goBack()}\n                className="-ml-2 hover:bg-violet-50"\n                aria-label={`Back to ${VIEW_LABELS[backTargetView]}`}\n              >\n                <ArrowLeft className="h-4 w-4 mr-1.5" />\n                Back to {VIEW_LABELS[backTargetView]}\n              </Button>\n            </div>\n          </div>\n        )}\n        <AnimatePresence mode="wait">'''
              ),
              (
                  '''            isRetrying={isGenerating}\n            onContinue={() => { setGenerationPhase("idle"); setGenerationStartedAt(null); }}\n            onRetry={handleRetryFailedScenes}''',
                  '''            isRetrying={isGenerating}\n            onContinue={() => { setGenerationOverlayDismissed(false); setGenerationPhase("idle"); setGenerationStartedAt(null); }}\n            onBack={() => { setGenerationOverlayDismissed(true); setGenerationPhase("idle"); }}\n            onRetry={handleRetryFailedScenes}'''
              ),
              (
                  '''          GENERATION LOCK OVERLAY\n          Blocks the entire page (header, content, navs, footer) while\n          videos are being generated. Non-dismissible until done.''',
                  '''          GENERATION PROGRESS OVERLAY\n          Shows full-screen progress while video jobs run, but remains safely\n          dismissible because generation is durable and continues in background.'''
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Guard failed: expected exactly one match, got {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          git diff --check
          grep -q 'Rendering continues safely in the background' src/app/page.tsx
          grep -q 'generationOverlayDismissed' src/app/page.tsx
          grep -q 'aria-label={`Back to ${VIEW_LABELS\[backTargetView\]}`}' src/app/page.tsx

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/page.tsx
          git commit -m 'fix(ui): make generation progress escapable and standardize back navigation'
          git push origin HEAD:fix/generation-navigation-recovery
