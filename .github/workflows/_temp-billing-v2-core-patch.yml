name: Apply Provider Cost Billing v2 core wiring

on:
  push:
    branches:
      - billing/provider-cost-backed-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: billing/provider-cost-backed-v2
          fetch-depth: 0
      - name: Patch billing core
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {count}')
              return text.replace(old, new, 1)

          schema_path = Path('prisma/schema.prisma')
          schema = schema_path.read_text()
          schema = replace_once(schema, '  refundTransactionId  String?\n  error                String?      @db.Text', '  refundTransactionId  String?\n  billingQuoteId       String?\n  creditReservationId  String?\n  error                String?      @db.Text', 'GenerationRun billing columns')
          if 'model ProviderPrice {' not in schema:
              schema += '''\n\nmodel ProviderPrice {\n  id             String   @id\n  provider       String\n  model          String\n  operation      String\n  billingUnit    String\n  unitPriceUsd   Float\n  unitsPerPrice  Float    @default(1)\n  sourceUrl      String   @db.Text\n  pricingVersion String\n  active         Boolean  @default(true)\n  verifiedAt     DateTime\n  effectiveFrom  DateTime @default(now())\n  effectiveUntil DateTime?\n  createdAt      DateTime @default(now())\n  updatedAt      DateTime @updatedAt\n\n  @@unique([provider, model, operation])\n  @@index([active, verifiedAt])\n}\n\nmodel CommercialPricingPolicy {\n  id                       String   @id @default("default")\n  creditValueUsd           Float    @default(0.01)\n  targetGrossMarginPct     Float    @default(0.35)\n  providerSafetyBufferPct  Float    @default(0.05)\n  fxSafetyBufferPct        Float    @default(0.05)\n  gatewayFeeReservePct     Float    @default(0.03)\n  infrastructureReservePct Float    @default(0.03)\n  minimumChargeCredits     Int      @default(1)\n  priceMaxAgeHours         Int      @default(1080)\n  quoteTtlMinutes          Int      @default(15)\n  billingEnabled           Boolean  @default(true)\n  updatedAt                DateTime @updatedAt\n}\n\nmodel BillingQuote {\n  id               String   @id\n  userId           String\n  projectId        String?\n  operation        String\n  status           String   @default("open")\n  pricingVersion   String\n  providerCostUsd  Float\n  bufferedCostUsd  Float\n  customerPriceUsd Float\n  creditsRequired  Int\n  breakdown        String   @db.Text\n  policySnapshot   String   @db.Text\n  expiresAt        DateTime\n  createdAt        DateTime @default(now())\n  updatedAt        DateTime @updatedAt\n\n  @@index([userId, createdAt])\n  @@index([projectId, createdAt])\n  @@index([status, expiresAt])\n}\n\nmodel CreditReservation {\n  id               String   @id\n  userId           String\n  quoteId          String   @unique\n  referenceId      String?\n  operation        String\n  reservedCredits  Int\n  capturedCredits  Int      @default(0)\n  releasedCredits  Int      @default(0)\n  status           String   @default("reserved")\n  idempotencyKey   String   @unique\n  createdAt        DateTime @default(now())\n  updatedAt        DateTime @updatedAt\n\n  @@index([userId, status])\n  @@index([referenceId])\n}\n\nmodel ProviderUsageLedger {\n  id               String   @id\n  userId           String\n  projectId        String?\n  sceneId          String?\n  generationRunId  String?\n  reservationId    String?\n  provider         String\n  model            String\n  operation        String\n  billingUnit      String\n  quantity         Float\n  providerCostUsd  Float\n  customerCredits  Int\n  customerValueUsd Float\n  grossProfitUsd   Float\n  grossMarginPct   Float\n  providerTaskId   String?\n  pricingVersion   String\n  status           String   @default("captured")\n  idempotencyKey   String   @unique\n  submittedAt      DateTime?\n  completedAt      DateTime?\n  createdAt        DateTime @default(now())\n  updatedAt        DateTime @updatedAt\n\n  @@index([userId, createdAt])\n  @@index([projectId, createdAt])\n  @@index([provider, model])\n  @@index([generationRunId])\n}\n'''
          schema_path.write_text(schema)

          route_path = Path('src/app/api/generate-video/route.ts')
          route = route_path.read_text()
          route = route.replace('import { checkTokens, deductTokensForOperation, refundTokens } from "@/lib/tokens";\n', 'import { refundTokens } from "@/lib/tokens";\n').replace('import { PRICING } from "@/lib/pricing";\n', '').replace('import { getEngineChargeInfo } from "@/lib/storefront";\n', '').replace('import { resolveModelForRequest } from "@/lib/video-models";\n', '')
          anchor = 'import { zaiErrorResponse } from "@/lib/zai-errors";\n'
          imports = 'import { buildProjectGenerationQuoteLines } from "@/lib/project-generation-quote";\nimport { createBillingQuote, getBillingQuote, releaseReservationRemainder, reserveBillingQuote, type BillingQuoteLine } from "@/lib/credit-reservations";\n'
          route = replace_once(route, anchor, anchor + imports, 'billing imports')
          start = route.find('function hasProviderReference('); end = route.find('\nasync function reconcileSafeReferenceDownloadFailure', start)
          if start >= 0 and end > start: route = route[:start] + route[end+1:]
          route = route.replace('    refundTransactionId: string | null;\n    error: string | null;', '    refundTransactionId: string | null;\n    creditReservationId: string | null;\n    error: string | null;')
          route = replace_once(route, '  let refundTransactionId = run.refundTransactionId;\n  if (run.totalTokens > 0 && !refundTransactionId) {', '  let refundTransactionId = run.refundTransactionId;\n  if (run.creditReservationId && !refundTransactionId) {\n    const released = await releaseReservationRemainder({ reservationId: run.creditReservationId, userId, reason: `Generation run ${run.id}: explicit pre-submission reference failure` });\n    if (released.creditsReleased > 0 || released.alreadyReleased) refundTransactionId = `reservation:${run.creditReservationId}:released`;\n  } else if (run.totalTokens > 0 && !refundTransactionId) {', 'reconciliation reservation release')
          route = replace_once(route, '    const { projectId, retry = false } = await req.json();', '    const { projectId, retry = false, quoteId } = await req.json();', 'quote body')
          s = route.find('    const sceneCharges = await Promise.all('); e = route.find('\n    let run;', s)
          if s < 0 or e < 0: raise SystemExit('pricing block missing')
          block = '''    const currentBilling = await buildProjectGenerationQuoteLines({ projectId, userId });\n    const billedSceneIds = new Set(currentBilling.lines.filter((line) => line.lineKey.startsWith("video:")).map((line) => line.sceneId).filter((id): id is string => Boolean(id)));\n    const processingSceneIds = new Set(scenesToProcess.map((scene) => scene.id));\n    if (billedSceneIds.size !== processingSceneIds.size || [...processingSceneIds].some((sceneId) => !billedSceneIds.has(sceneId))) {\n      return NextResponse.json({ success: false, error: "Project generation state changed while pricing. Refresh and request a new cost quote.", code: "BILLING_SCOPE_CHANGED" }, { status: 409 });\n    }\n    const lineSignature = (lines: BillingQuoteLine[]) => JSON.stringify([...lines].map((line) => ({ lineKey: line.lineKey, provider: line.provider, model: line.model, operation: line.operation, quantity: line.quantity, credits: line.credits, pricingVersion: line.pricingVersion })).sort((a, b) => a.lineKey.localeCompare(b.lineKey)));\n    let billingQuote;\n    if (typeof quoteId === "string" && quoteId.trim()) {\n      billingQuote = await getBillingQuote(quoteId.trim());\n      if (!billingQuote || billingQuote.userId !== userId || billingQuote.projectId !== projectId || billingQuote.status !== "open" || billingQuote.expiresAt.getTime() <= Date.now() || lineSignature(billingQuote.breakdown) !== lineSignature(currentBilling.lines)) {\n        return NextResponse.json({ success: false, error: "The generation price changed or expired. Review the refreshed cost before generating.", code: "BILLING_QUOTE_STALE" }, { status: 409 });\n      }\n    } else {\n      billingQuote = await createBillingQuote({ userId, projectId, operation: "project_generation", lines: currentBilling.lines, policy: currentBilling.policy });\n    }\n    const totalTokensNeeded = billingQuote.creditsRequired;\n    const totalCostUsd = billingQuote.providerCostUsd;\n    const tokensPerScene = Math.ceil(totalTokensNeeded / scenesToProcess.length);\n    const costUsdPerScene = totalCostUsd / scenesToProcess.length;\n'''
          route = route[:s] + block + route[e:]
          route = replace_once(route, '          costUsdPerScene,\n        },', '          costUsdPerScene,\n          billingQuoteId: billingQuote.id,\n        },', 'run quote')
          s = route.find('    const deduction = await deductTokensForOperation({'); marker = '    await db.videoProject.update({ where: { id: projectId }, data: { status: "generating" } });'; e = route.find(marker, s)
          if s < 0 or e < 0: raise SystemExit('deduction block missing')
          e += len(marker)
          block = '''    let reservationResult;\n    try {\n      reservationResult = await reserveBillingQuote({ quoteId: billingQuote.id, userId, referenceId: run.id, idempotencyKey: `generation:${run.id}:reservation` });\n    } catch (error) {\n      await db.generationRun.update({ where: { id: run.id }, data: { status: "failed", activeKey: null, error: error instanceof Error ? error.message : "Credit reservation failed" } }).catch(() => undefined);\n      return NextResponse.json({ success: false, error: error instanceof Error ? error.message : "Could not reserve generation credits", code: "CREDIT_RESERVATION_FAILED" }, { status: 402 });\n    }\n    await db.generationRun.update({ where: { id: run.id }, data: { status: "running", billingQuoteId: billingQuote.id, creditReservationId: reservationResult.reservation.id } });\n    await db.videoProject.update({ where: { id: projectId }, data: { status: "generating" } });'''
          route = route[:s] + block + route[e:]
          route = route.replace('      tokensCharged: totalTokensNeeded,\n      remainingTokens: deduction.remainingTokens,', '      tokensCharged: 0,\n      creditsReserved: totalTokensNeeded,\n      remainingTokens: reservationResult.wallet.availableCredits,')
          route_path.write_text(route)

          worker_path = Path('scripts/generation-worker.ts'); worker = worker_path.read_text()
          worker = replace_once(worker, 'import { autoNarrateScene } from "@/lib/narration";\n', 'import { autoNarrateScene } from "@/lib/narration";\nimport { captureReservedQuoteLine, releaseReservationRemainder } from "@/lib/credit-reservations";\n', 'worker import')
          worker = replace_once(worker, '    videoModel: string | null;\n  };\n}): Promise<string> {', '    videoModel: string | null;\n  };\n  billing: { userId: string; projectId: string; reservationId: string };\n}): Promise<string> {', 'submit billing')
          worker = replace_once(worker, '  const { runId, scene, videoSize, origin, ctx } = opts;', '  const { runId, scene, videoSize, origin, ctx, billing } = opts;', 'submit destructure')
          worker = replace_once(worker, '  await db.videoScene.update({\n    where: { id: scene.id },\n    data: { taskId, status: "generating", errorMessage: null },\n  });\n  await heartbeat(runId);', '  await db.videoScene.update({\n    where: { id: scene.id },\n    data: { taskId, status: "generating", errorMessage: null },\n  });\n  await captureReservedQuoteLine({ reservationId: billing.reservationId, lineKey: `video:${scene.id}`, userId: billing.userId, projectId: billing.projectId, sceneId: scene.id, generationRunId: runId, providerTaskId: taskId });\n  await heartbeat(runId);', 'video capture')
          worker = replace_once(worker, '  ctx: { style: string; characters: CharacterLike[] };\n}): Promise<boolean> {', '  ctx: { style: string; characters: CharacterLike[] };\n  billing: { userId: string; projectId: string; reservationId: string };\n}): Promise<boolean> {', 'thumb billing')
          worker = replace_once(worker, '  const { runId, scene, thumbSize, ctx } = opts;', '  const { runId, scene, thumbSize, ctx, billing } = opts;', 'thumb destructure')
          worker = replace_once(worker, '    const imageUrl = await saveGeneratedFile(', '    await captureReservedQuoteLine({ reservationId: billing.reservationId, lineKey: `thumbnail:${scene.id}`, userId: billing.userId, projectId: billing.projectId, sceneId: scene.id, generationRunId: runId });\n    const imageUrl = await saveGeneratedFile(', 'thumb capture')
          worker = replace_once(worker, '  taskId: string;\n}): Promise<"completed" | "waiting" | "failed"> {', '  taskId: string;\n  billing: { userId: string; projectId: string; reservationId: string };\n}): Promise<"completed" | "waiting" | "failed"> {', 'poll billing')
          worker = replace_once(worker, '    void autoNarrateScene(opts.sceneId);', '    await autoNarrateScene(opts.sceneId, { reservationId: opts.billing.reservationId, generationRunId: opts.runId });', 'await narration')
          worker = replace_once(worker, '  const ambiguous = scenes.find((scene) => scene.status === "submitting" && !scene.taskId);', '  const reservationId = run.creditReservationId;\n  if (!reservationId) {\n    await markReconciliation(run.id, project.id, "Generation run has no prepaid credit reservation; provider execution is blocked");\n    return;\n  }\n  const billing = { userId: run.userId, projectId: project.id, reservationId };\n\n  const ambiguous = scenes.find((scene) => scene.status === "submitting" && !scene.taskId);', 'worker gate')
          worker = replace_once(worker, '      await submitSceneTask({ runId: run.id, scene, videoSize, origin, ctx });', '      await submitSceneTask({ runId: run.id, scene, videoSize, origin, ctx, billing });', 'submit call')
          worker = replace_once(worker, '    await ensureThumbnail({ runId: run.id, scene, thumbSize, ctx });', '    await ensureThumbnail({ runId: run.id, scene, thumbSize, ctx, billing });', 'thumb call')
          worker = replace_once(worker, '    const state = await pollSubmittedTask({ runId: run.id, sceneId: scene.id, taskId: scene.taskId! });', '    const state = await pollSubmittedTask({ runId: run.id, sceneId: scene.id, taskId: scene.taskId!, billing });', 'poll call')
          worker = replace_once(worker, '  if (allVideosDone) {\n    const incompleteProjectScenes = await db.videoScene.count({', '  if (allVideosDone) {\n    const narrationPending = finalScenes.some((scene) => Boolean(scene.dialogue?.trim()) && !scene.narrationUrl);\n    if (!narrationPending) await releaseReservationRemainder({ reservationId, userId: run.userId, reason: `Generation run ${run.id} completed with no remaining provider work` });\n    const incompleteProjectScenes = await db.videoScene.count({', 'completion release')
          worker_path.write_text(worker)

          narration_path = Path('src/lib/narration.ts'); narration = narration_path.read_text()
          narration = narration.replace('import { PRICING } from "@/lib/pricing";\n', '').replace('import { deductTokensForOperation } from "@/lib/tokens";\n', '').replace('} from "@/lib/ai-provider-router";', '} from "@/lib/ai-provider-router-qwen";')
          narration = replace_once(narration, 'import path from "path";\n', 'import path from "path";\nimport { resolveQwenTtsModel } from "@/lib/qwen-tts";\nimport { getCommercialPricingPolicy, quoteProviderCharge, BillingSafetyError } from "@/lib/provider-cost-billing";\nimport { createBillingQuote, reserveBillingQuote, captureReservedQuoteLine, type BillingQuoteLine } from "@/lib/credit-reservations";\n', 'narration imports')
          narration = replace_once(narration, '  style?: string;\n}): Promise<NarrationResult> {', '  style?: string;\n  billingReservationId?: string;\n  generationRunId?: string;\n}): Promise<NarrationResult> {', 'narration options')
          narration = replace_once(narration, '      project: { select: { userId: true } },', '      project: { select: { id: true, userId: true } },', 'project id')
          narration = replace_once(narration, '  const providerSettings = await getAIProviderSettings();\n  const providerModel = providerSettings.ttsProvider === "elevenlabs"\n    ? (providerSettings.ttsModel || "eleven_v3")\n    : (providerSettings.ttsModel || "zai-tts");', '  const providerSettings = await getAIProviderSettings();\n  if (providerSettings.ttsProvider !== "qwen") throw new BillingSafetyError("UNPRICED_TTS_PROVIDER", `Narration provider ${providerSettings.ttsProvider} is not enabled for cost-backed billing. Configure Qwen or add a verified provider price first.`);\n  const providerModel = resolveQwenTtsModel(providerSettings.ttsModel);', 'provider model')
          narration = narration.replace('    providerVoiceConfig: providerSettings.ttsProvider === "elevenlabs"\n      ? {\n          default: providerSettings.elevenLabsDefaultVoiceId,\n          map: providerSettings.elevenLabsVoiceMap,\n        }\n      : null,', '    providerVoiceConfig: null,')
          narration = replace_once(narration, '  const operationKey = `tts:${userId}:${scene.id}:${fingerprint}`;\n  const tokensToCharge = chunks.length * PRICING.tts.tokens;\n  const costUsd = chunks.length * PRICING.tts.costUsd;', '  const operationKey = `tts:${userId}:${scene.id}:${fingerprint}`;\n  const totalCharacters = chunks.reduce((sum, chunk) => sum + chunk.text.length, 0);\n  const policy = await getCommercialPricingPolicy();\n  const ttsCharge = await quoteProviderCharge({ provider: "qwen", model: providerModel, operation: "tts", quantity: Math.max(1, totalCharacters), policy });\n  const ttsLine: BillingQuoteLine = { ...ttsCharge, lineKey: `tts:${scene.id}`, label: `Qwen narration (${Math.max(1, totalCharacters)} chars)`, sceneId: scene.id };', 'character price')
          s = narration.find('  const deduction = await deductTokensForOperation({'); e = narration.find('  if (audioFileExists(finalFilename)) {', s)
          if s < 0 or e < 0: raise SystemExit('narration deduction block missing')
          reserve = '''  let reservationId = opts.billingReservationId || "";\n  let availableCredits: number | undefined;\n  if (!reservationId) {\n    const reusable = await db.$queryRaw<Array<{ id: string; breakdown: string }>>`SELECT r."id", q."breakdown" FROM "CreditReservation" r JOIN "BillingQuote" q ON q."id" = r."quoteId" WHERE r."userId" = ${userId} AND q."projectId" = ${scene.project.id} AND r."status" IN ('reserved', 'partially_captured') ORDER BY r."createdAt" DESC LIMIT 10`;\n    const matched = reusable.find((candidate) => { try { const lines = JSON.parse(candidate.breakdown) as Array<{ lineKey?: string }>; return Array.isArray(lines) && lines.some((item) => item.lineKey === ttsLine.lineKey); } catch { return false; } });\n    if (matched) reservationId = matched.id;\n  }\n  if (!reservationId) {\n    const quote = await createBillingQuote({ userId, projectId: scene.project.id, operation: "tts", lines: [ttsLine], policy });\n    const reserved = await reserveBillingQuote({ quoteId: quote.id, userId, referenceId: scene.id, idempotencyKey: `tts:${userId}:${scene.id}:${fingerprint}:reservation` });\n    reservationId = reserved.reservation.id; availableCredits = reserved.wallet.availableCredits;\n  }\n  let capturedCredits = 0;\n\n'''
          narration = narration[:s] + reserve + narration[e:]
          narration = narration.replace('      tokensCharged: deduction.alreadyApplied ? 0 : tokensToCharge,\n      remainingTokens: deduction.remainingTokens,\n      transactionId: deduction.transactionId,', '      tokensCharged: 0,\n      remainingTokens: availableCredits,')
          call = '      const speech = await synthesizeProviderSpeech({\n        input: chunks[i].text,\n        voice: chunks[i].voice,\n        language: profile.language,\n        accent: profile.accent,\n        direction: chunks[i].direction,\n        speed,\n      });'
          narration = replace_once(narration, call, call + '\n      if (capturedCredits === 0) {\n        const captured = await captureReservedQuoteLine({ reservationId, lineKey: ttsLine.lineKey, userId, projectId: scene.project.id, sceneId: scene.id, generationRunId: opts.generationRunId });\n        capturedCredits = captured.alreadyCaptured ? 0 : captured.creditsCaptured;\n      }', 'tts capture')
          narration = narration.replace('      tokensCharged: deduction.alreadyApplied ? 0 : tokensToCharge,\n      remainingTokens: deduction.remainingTokens,\n      transactionId: deduction.transactionId,', '      tokensCharged: capturedCredits,\n      remainingTokens: availableCredits,')
          narration = replace_once(narration, 'export async function autoNarrateScene(sceneId: string): Promise<AutoNarrateResult> {', 'export async function autoNarrateScene(sceneId: string, billing?: { reservationId?: string; generationRunId?: string }): Promise<AutoNarrateResult> {', 'auto signature')
          narration = replace_once(narration, '      style: scene.narrationStyle || undefined,\n    });', '      style: scene.narrationStyle || undefined,\n      billingReservationId: billing?.reservationId,\n      generationRunId: billing?.generationRunId,\n    });', 'auto context')
          narration_path.write_text(narration)
          PY
      - name: Validate patch structure
        run: |
          git diff --check
          grep -q 'creditReservationId' prisma/schema.prisma
          grep -q 'reserveBillingQuote' src/app/api/generate-video/route.ts
          grep -q 'captureReservedQuoteLine' scripts/generation-worker.ts
          grep -q 'ai-provider-router-qwen' src/lib/narration.ts
      - name: Commit core wiring and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_temp-billing-v2-core-patch.yml
          git add prisma/schema.prisma src/app/api/generate-video/route.ts scripts/generation-worker.ts src/lib/narration.ts
          git diff --cached --check
          git commit -m "Wire cost-backed reservations through provider execution"
          git push origin HEAD:billing/provider-cost-backed-v2
