name: One-shot durable export cutover

on:
  push:
    branches:
      - production-hardening/p0-security-billing
    paths:
      - .github/workflows/one-shot-export-worker-cutover.yml
      - scripts/export-worker-cutover.py

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-hardening/p0-security-billing
          fetch-depth: 0
      - name: Apply exact export cutover
        run: python3 scripts/export-worker-cutover.py
      - name: Commit durable export route
        run: |
          if git diff --quiet -- src/app/api/export-video/route.ts; then
            echo "No export cutover necessary."
            exit 0
          fi
          git config user.name "vidora-hardening-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/api/export-video/route.ts
          git commit -m "jobs: make export route enqueue-only and restart-safe"
          git push origin HEAD:production-hardening/p0-security-billing
