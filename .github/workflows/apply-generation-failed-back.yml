name: Apply failed generation back fix

on:
  push:
    branches:
      - fix/generation-retry-billing-ux

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node scripts/patch-generation-failed-back.cjs
      - run: git diff --check
      - name: Commit source change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git commit -m "fix(ui): keep failed generation modal dismissed"
          git push origin HEAD:fix/generation-retry-billing-ux
