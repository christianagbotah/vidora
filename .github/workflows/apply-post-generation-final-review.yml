name: Apply post-generation final review

on:
  push:
    branches:
      - feature/post-generation-edit-preview

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/patch-post-generation-final-review.py
      - run: git diff --check
      - name: Commit final review changes
        run: |
          if git diff --quiet; then
            echo "No review changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generation-worker.ts src/app/api/generate-video-scene/route.ts \
            'src/app/api/projects/[id]/finalize-draft/route.ts' src/app/page.tsx
          git commit -m "fix(editor): prioritize subject identity and require review before export"
          git push origin HEAD:feature/post-generation-edit-preview
