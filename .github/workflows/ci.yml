name: Vidora CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - production-hardening/**
  workflow_dispatch:
  schedule:
    # Recovery path: validate the default branch even when an integration-created
    # push/PR event is suppressed before GitHub can enqueue the normal CI run.
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: vidora-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vidora
          POSTGRES_PASSWORD: vidora_ci_password
          POSTGRES_DB: vidora_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vidora -d vidora_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://vidora:vidora_ci_password@localhost:5432/vidora_ci?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-nextauth-secret-0123456789abcdef0123456789abcdef
      CONFIG_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      ZAI_BASE_URL: https://example.invalid/api
      ZAI_API_KEY: ci-not-a-real-api-key
      PAYSTACK_SECRET_KEY: sk_test_ci_not_real
      STRIPE_SECRET_KEY: sk_test_ci_not_real
      STRIPE_WEBHOOK_SECRET: whsec_ci_not_real
      HUBTEL_CLIENT_ID: ci-not-real
      HUBTEL_CLIENT_SECRET: ci-not-real
      HUBTEL_MERCHANT_ACCOUNT_NUMBER: "000000"
      SMTP_HOST: smtp.example.invalid
      SMTP_PORT: "587"
      SMTP_USER: ci@example.invalid
      SMTP_PASSWORD: ci-not-real
      VIDORA_E2E_EMAIL: e2e@vidora.local
      VIDORA_E2E_PASSWORD: VidoraE2E!2026
      VIDORA_E2E_PROJECT_TITLE: Vidora E2E Golden Project
      VIDORA_E2E_BASE_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate production shell syntax
        run: bash -n deploy.sh rollback.sh cron-check.sh scripts/check-ffmpeg-export.sh scripts/check-storage-path-topology.sh

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify FFmpeg export capability
        run: bash scripts/check-ffmpeg-export.sh

      - name: Generate Prisma client
        run: bunx prisma generate

      # CI now exercises the same versioned migration chain production deploys.
      # This is essential for database-level invariants such as billing locks,
      # export review guards, and future triggers that prisma db push cannot create.
      - name: Apply production migrations to disposable database
        run: bunx prisma migrate deploy

      - name: Verify runtime database contract
        run: NODE_ENV=test bun scripts/check-runtime-db-contract.ts

      - name: Lint
        run: bun run lint

      - name: TypeScript
        run: bun run typecheck

      - name: Unit tests
        run: bun run test:unit

      - name: PostgreSQL integration tests
        run: bun run test:integration

      - name: Production build
        run: bun run build

      # Keep browser tooling outside Vidora's Bun-managed node_modules and lockfile.
      # GitHub's Ubuntu image already ships stable Chrome; Playwright drives that
      # system browser rather than downloading another browser binary.
      - name: Install isolated browser E2E harness
        run: |
          google-chrome --version
          rm -rf /tmp/vidora-playwright
          npm install --prefix /tmp/vidora-playwright --package-lock=false --ignore-scripts @playwright/test@1.55.0

      - name: Zero-cost browser golden path
        run: |
          set -euo pipefail
          export NODE_PATH=/tmp/vidora-playwright/node_modules
          SERVER_PID=""

          cleanup() {
            if [[ -n "$SERVER_PID" ]]; then
              kill "$SERVER_PID" 2>/dev/null || true
              wait "$SERVER_PID" 2>/dev/null || true
            fi
            bun scripts/e2e-seed.ts cleanup || true
          }
          trap cleanup EXIT

          bun scripts/e2e-seed.ts seed
          HOSTNAME=127.0.0.1 PORT=3000 bun .next/standalone/server.js > /tmp/vidora-e2e-server.log 2>&1 &
          SERVER_PID=$!

          READY=0
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              READY=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [[ "$READY" != "1" ]]; then
            echo "Vidora production server did not become ready for browser E2E." >&2
            cat /tmp/vidora-e2e-server.log >&2 || true
            exit 1
          fi

          /tmp/vidora-playwright/node_modules/.bin/playwright test --config=playwright.config.js
