name: Apply language export fix

on:
  push:
    branches:
      - fix/language-and-export-pipeline-20260906

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[language-export-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact language/export patch
        run: python3 scripts/apply-language-export-fix.py
      - name: Commit patched production files
        run: |
          if git diff --quiet; then
            echo "No changes produced"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/full-preview-render.ts src/app/api/export-video/route.ts
          git commit -m "fix: make language and export pipeline resilient [language-export-fix-applied]"
          git push
