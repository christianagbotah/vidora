name: Patch dedicated TTS admin

on:
  push:
    branches:
      - fix/dedicated-glm-tts-endpoint-20260905

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[dedicated-tts-admin-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact admin UI patch
        run: python3 scripts/patch-dedicated-tts-admin.py
      - name: Commit patched page
        run: |
          if git diff --quiet; then
            echo "No changes produced"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/admin/providers/page.tsx
          git commit -m "feat: expose dedicated GLM TTS admin controls [dedicated-tts-admin-applied]"
          git push
