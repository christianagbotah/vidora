name: Patch narration profile Studio UI

on:
  push:
    branches:
      - feat/narration-profile-studio-ui-20260905

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[ui-patch-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact Studio patch
        run: python3 scripts/patch-narration-profile-studio-ui.py

      - name: Commit patched page
        run: |
          if git diff --quiet -- src/app/page.tsx; then
            echo "No page changes produced"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git commit -m "feat: wire narration profiles into Studio [ui-patch-applied]"
          git push
