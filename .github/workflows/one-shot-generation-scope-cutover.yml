name: One-shot single-scene generation cutover

on:
  push:
    branches:
      - production-hardening/p0-security-billing
    paths:
      - .github/workflows/one-shot-generation-scope-cutover.yml
      - scripts/generation-scope-cutover.py

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-hardening/p0-security-billing
          fetch-depth: 0
      - name: Apply exact generation scope cutover
        run: python3 scripts/generation-scope-cutover.py
      - name: Commit durable scoped generation files
        run: |
          if git diff --quiet -- prisma/schema.prisma scripts/generation-worker.ts src/app/api/generate-video-scene/route.ts; then
            echo "No generation scope cutover necessary."
            exit 0
          fi
          git config user.name "vidora-hardening-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prisma/schema.prisma scripts/generation-worker.ts src/app/api/generate-video-scene/route.ts
          git commit -m "jobs: route single-scene generation through durable worker"
          git push origin HEAD:production-hardening/p0-security-billing
