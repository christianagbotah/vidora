name: Apply project retry and character layout

on:
  push:
    branches:
      - fix/project-retry-character-layout

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded UI patch
        run: node scripts/patch-project-retry-character-layout.cjs
      - name: Validate diff
        run: git diff --check
      - name: Commit source change
        run: |
          if git diff --quiet; then
            echo "No source changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git commit -m "fix(ui): expose project retry and tidy character actions"
          git push origin HEAD:fix/project-retry-character-layout
