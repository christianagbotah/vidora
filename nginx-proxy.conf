# Vidora reverse proxy config
# Installed to: /var/webuzo-data/nginx/custom/domains/vidora.lightworldtech.com.conf
# Included AFTER Webuzo's common config — we override the fallback variable.

# Override Webuzo's $noindex so try_files falls to our proxy instead of default page
set $noindex @vidora_proxy;

# Named location that proxies all traffic to the Next.js app
location @vidora_proxy {
    proxy_pass http://127.0.0.1:3004;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 60s;
}

# Catch-all proxy for all requests
location / {
    proxy_pass http://127.0.0.1:3004;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 100M;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 60s;
}

location /_next/static {
    proxy_pass http://127.0.0.1:3004;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
