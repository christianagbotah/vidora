# Vidora reverse proxy config
# Copy to: /var/webuzo-data/nginx/custom/domains/vidora.lightworldtech.com.conf
# This file is included by Webuzo's main vhost — do NOT add server blocks here.

location / {
    proxy_pass http://127.0.0.1:3004;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Video uploads and large payloads
    client_max_body_size 100M;

    # Timeouts for AI generation endpoints
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 60s;
}

location /_next/static {
    proxy_pass http://127.0.0.1:3004;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
